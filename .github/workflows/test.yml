name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ checkout csp
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5

      - name: 📦 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 📦 setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10.11

      - name: 👷 Install
        shell: bash
        run: |
          pnpm install --frozen-lockfile --no-verify-store-integrity
          pnpm server:install

      - name: 🧪 Static
        shell: bash
        run: |
          pnpm node:static
          pnpm server:static
          pnpm server:test
